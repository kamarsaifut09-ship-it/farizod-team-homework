<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Analysis – Daily</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500&family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,500&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9ecef;min-height:100vh;display:flex;justify-content:center;align-items:center;font-family:'Poppins',sans-serif}
.phone{position:relative;width:430px;height:932px;overflow:hidden;background:#00D09E;border-radius:40px;flex:none}
.a{position:absolute}
.ls{font-family:'League Spartan',sans-serif}
.t{position:absolute;white-space:nowrap;display:flex;align-items:center;text-transform:capitalize}
.sub{font-size:15px;line-height:22px;font-weight:500;color:#093030}
.panel{position:absolute;left:0;top:282px;width:430px;height:650px;background:#fff;border-radius:70px 70px 0 0;padding:35px 0 0 37px;display:flex;flex-direction:column;gap:30px;overflow-y:auto;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.switch{width:357px;height:60px;background:#DFF7E2;border-radius:22px;display:flex;justify-content:center;align-items:center;padding:6px 5px;gap:10px;flex:none}
.tab{width:80px;height:50px;border-radius:19px;background:#DFF7E2;display:flex;align-items:center;justify-content:center;font-size:15px;line-height:22px;color:#052224;flex:none;cursor:pointer;border:0;font-family:inherit}
.tab.on{background:#00D09E}
.f447{width:357px;display:flex;flex-direction:column;gap:32px;flex:none;padding-bottom:140px}
.card{position:relative;width:357px;height:247px;background:#DFF7E2;border-radius:50px;flex:none}
.gl{position:absolute;left:49px;width:278px;height:0;border-top:.5px dashed #6DB6FE}
.yl{position:absolute;left:30px;font-size:14px;line-height:13px;color:#6DB6FE}
.dl{position:absolute;top:205px;font-size:14px;line-height:13px;color:#0E3E3E}
.bars{position:absolute;left:56px;top:99px;width:264px;height:101px;display:flex;align-items:flex-end;gap:23px}
.bg{width:18px;display:flex;justify-content:center;align-items:flex-end;gap:6px}
.bg i{display:block;width:6px;border-radius:31px 31px 0 0}
.g{background:#00D09E}.b{background:#0068FF}
.ib{position:absolute;top:16px;width:32.26px;height:30px;background:#00D09E;border-radius:12.45px;display:flex;align-items:center;justify-content:center}
.sum{width:277px;height:76px;display:flex;align-items:flex-end;gap:94px}
.sum>div{display:flex;flex-direction:column;align-items:center}
.amt{font-size:20px;line-height:22px;font-weight:600;color:#093030}
.tg{position:relative;width:169px;height:167px;background:#6DB6FE;border-radius:50px;flex:none}
.tg .lb{position:absolute;top:132px;width:100%;text-align:center;color:#F1FFF3;font-size:15px;line-height:22px;font-weight:500}
.tg .pc{position:absolute;top:64px;width:100%;text-align:center;color:#F1FFF3;font-size:20px;line-height:22px;font-weight:600}
.tg svg{position:absolute;left:27px;top:21px}
.nav{position:absolute;left:0;bottom:0;width:430px;height:108px;background:#DFF7E2;border-radius:70px 70px 0 0;display:flex;align-items:center;padding:36px 60px 41px;gap:43px}
.nav svg{flex:none;position:relative;z-index:1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav .hl{position:absolute;width:57px;height:53px;background:#00D09E;border-radius:22px;top:calc(50% - 26.5px);transition:left .3s cubic-bezier(.4,0,.2,1);z-index:0}
.nav .hit{position:absolute;top:0;height:100%;z-index:2;cursor:pointer}
.ph{width:357px;height:300px;display:flex;align-items:center;justify-content:center;text-align:center;color:#093030;font-size:15px;line-height:22px;flex:none}
</style>
</head>
<body>
<div class="phone">
    
  <!-- status bar -->
  <div class="t ls" style="left:37px;top:9px;width:30px;height:14px;font-size:13px;line-height:12px;font-weight:500;color:#fff;text-transform:none">16:04</div>
  <svg class="a" style="left:338px;top:9px" width="13" height="11" viewBox="0 0 13 11" fill="#fff"><rect x="0" y="7" width="2.5" height="4" rx=".5"/><rect x="3.5" y="5" width="2.5" height="6" rx=".5"/><rect x="7" y="2.5" width="2.5" height="8.5" rx=".5"/><rect x="10.5" y="0" width="2.5" height="11" rx=".5"/></svg>
  <svg class="a" style="left:356px;top:9px" width="15" height="11" viewBox="0 0 15 11" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M1 4a9.5 9.5 0 0 1 13 0M3.2 6.3a6.3 6.3 0 0 1 8.6 0"/><circle cx="7.5" cy="9" r="1" fill="#fff" stroke="none"/></svg>
  <svg class="a" style="left:376px;top:11px" width="17" height="9" viewBox="0 0 17 9"><rect x=".5" y=".5" width="15" height="8" rx="1.5" fill="none" stroke="#fff"/><rect x="2" y="2" width="12" height="5" rx=".5" fill="#fff"/></svg>

  <!-- header -->

    <svg width="19" height="16" viewBox="0 0 19 16" fill="none" stroke="#F1FFF3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none"><path d="M18 8H1.5M8 1.5 1.5 8 8 14.5"/></svg>
    <div class="t" style="position:static;width:255px;height:22px;justify-content:center;font-size:20px;line-height:22px;font-weight:600;color:#093030;flex:none" id="ttl">Analysis</div>

    </div>
  </div>

  <!-- balance -->
  <div class="t" style="left:78px;top:136px;width:82px;height:18px;font-size:12px;line-height:18px;color:#093030">
    <svg width="10" height="10" viewBox="0 0 12 12" style="display:none"></svg>Total Balance</div>
  <div class="t" style="left:60px;top:152px;width:117px;height:36px;font-size:24px;line-height:36px;font-weight:700;color:#F1FFF3">$7,783.00</div>
  <div class="a" style="left:216px;top:136px;width:42px;height:0;border-top:1px solid #DFF7E2;transform:rotate(-90deg)"></div>
  <div class="t" style="left:268px;top:137px;width:82px;height:18px;font-size:12px;line-height:18px;color:#093030">Total Expense</div>
  <div class="t" style="left:249px;top:152px;width:120px;height:36px;font-size:24px;line-height:36px;font-weight:600;color:#0068FF">-$1.187.40</div>

  <!-- progress -->
  <div class="a" style="left:50px;top:200px;width:330px;height:27px;background:#052224;border-radius:13.5px"></div>
  <div class="a" style="left:119px;top:200px;width:261px;height:27px;background:#F1FFF3;border-radius:13.5px"></div>
  <div class="t" style="left:71px;top:205px;width:23px;height:18px;font-size:12px;line-height:18px;color:#F1FFF3">30%</div>
  <div class="t" style="left:294px;top:203px;width:72px;height:20px;font-size:13px;line-height:20px;font-weight:500;font-style:italic;color:#052224">$20,000.00</div>
  <svg class="a" style="left:60px;top:243px" width="11" height="11" viewBox="0 0 11 11" fill="none" stroke="#052224"><rect x=".5" y=".5" width="10" height="10" rx="2"/><path d="M3 5.6 4.8 7.4 8 3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <div class="t" style="left:81px;top:237px;width:254px;height:23px;font-size:15px;line-height:22px;color:#052224;text-transform:none">30% of your expenses, looks good.</div>

  <!-- panel -->
  <div class="panel">
    <div class="switch">
      <button class="tab on">Daily</button><button class="tab">Weekly</button><button class="tab">Monthly</button><button class="tab">Year</button>
    </div>
    <div class="f447">
      <div class="card">
        <div class="t sub" style="left:29px;top:21px;width:147px;height:23px">Income &amp; Expenses</div>
        <div class="gl" style="top:167px"></div><div class="gl" style="top:134px"></div><div class="gl" style="top:101px"></div><div class="gl" style="top:68px"></div>
        <div class="bars">
          <div class="bg" style="height:85px"><i class="g" style="height:56px"></i><i class="b" style="height:85px"></i></div>
          <div class="bg" style="height:47px"><i class="g" style="height:17px"></i><i class="b" style="height:47px"></i></div>
          <div class="bg" style="height:83px"><i class="g" style="height:83px"></i><i class="b" style="height:50px"></i></div>
          <div class="bg" style="height:63px"><i class="g" style="height:10px"></i><i class="b" style="height:63px"></i></div>
          <div class="bg" style="height:101px"><i class="g" style="height:101px"></i><i class="b" style="height:92px"></i></div>
          <div class="bg" style="height:30px"><i class="g" style="height:30px"></i><i class="b" style="height:8px"></i></div>
          <div class="bg" style="height:73px"><i class="g" style="height:32px"></i><i class="b" style="height:73px"></i></div>
        </div>
        <div class="a" style="left:32px;top:200px;width:295px;border-top:1px solid #0E3E3E"></div>
        <span class="a ls yl" style="top:160px">1k</span><span class="a ls yl" style="top:127px">5k</span><span class="a ls yl" style="top:94px">10k</span><span class="a ls yl" style="top:62px">15k</span>
        <span class="a ls dl" style="left:53px">Mon</span><span class="a ls dl" style="left:96px">Tue</span><span class="a ls dl" style="left:134px">Wed</span><span class="a ls dl" style="left:176px">Thu</span><span class="a ls dl" style="left:220px">Fri</span><span class="a ls dl" style="left:259px">Sat</span><span class="a ls dl" style="left:299px">Sun</span>
        <div class="ib" style="left:259px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#093030" stroke-width="1.5" stroke-linecap="round"><circle cx="7" cy="7" r="5.2"/><path d="m11 11 3.5 3.5"/></svg></div>
        <div class="ib" style="left:295px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="#093030" stroke-width="1.28" stroke-linecap="round" stroke-linejoin="round"><rect x="1.5" y="2.8" width="13" height="11.7" rx="2"/><path d="M1.5 6.6h13M5 1v3M11 1v3"/></svg></div>
      </div>

      <div style="width:357px;display:flex;flex-direction:column;align-items:center;gap:32px">
        <div class="sum">
          <div style="width:95px;gap:5px">
            <svg width="25" height="25" viewBox="0 0 25 25" fill="none" stroke="#00D09E" stroke-width="2.08" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="23" height="23" rx="6.25"/><path d="M8 8h9v9M17 8 7.5 17.5" transform="rotate(90 12.5 12.5)"/></svg>
            <div style="display:flex;flex-direction:column;align-items:center"><div class="sub" style="line-height:23px">Income</div><div class="amt">$4,120.00</div></div>
          </div>
          <div style="width:88px;gap:6px">
            <svg width="25" height="25" viewBox="0 0 25 25" fill="none" stroke="#0068FF" stroke-width="2.08" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1" width="23" height="23" rx="6.25"/><path d="M8 8h9v9M17 8 7.5 17.5"/></svg>
            <div style="display:flex;flex-direction:column;align-items:center"><div class="sub" style="line-height:23px">Expense</div><div class="amt" style="color:#0068FF">$1.187.40</div></div>
          </div>
        </div>
        <div style="width:357px;display:flex;flex-direction:column;gap:15px">
          <div class="sub" style="line-height:23px">My Targets</div>
          <div style="display:flex;gap:19px">
            <div class="tg">
              <div class="pc">30%</div><div class="lb">Travel</div>
              <svg width="104" height="104" viewBox="0 0 104 104" fill="none" style="transform:rotate(-87.73deg)"><circle cx="52" cy="52" r="50" stroke="#F1FFF3" stroke-width="3.5"/><circle cx="52" cy="52" r="50" stroke="#0068FF" stroke-width="4.9" stroke-dasharray="94 220" stroke-linecap="round"/></svg>
            </div>
            <div class="tg">
              <div class="pc">50%</div><div class="lb">Car</div>
              <svg width="104" height="104" viewBox="0 0 104 104" fill="none" style="transform:rotate(-87.73deg);left:30px"><circle cx="52" cy="52" r="50" stroke="#F1FFF3" stroke-width="3.5"/><circle cx="52" cy="52" r="50" stroke="#0068FF" stroke-width="4.9" stroke-dasharray="157 157" stroke-linecap="round"/></svg>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- bottom nav -->
  <div class="nav">
    <svg width="25" height="31" viewBox="0 0 25 31" fill="none" stroke="#052224" stroke-width="2" stroke-linejoin="round"><path d="M2 12 12.5 3 23 12v15a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2ZM9 29V18h7v11"/></svg>
    <div style="position:relative;width:31px;height:30px;flex:none">
      
      <svg class="a" style="left:0;top:0" width="31" height="30" viewBox="0 0 31 30" fill="none" stroke="#052224" stroke-width="2" stroke-linecap="round"><path d="M2 28h27M5 28V16M12 28V6M19 28V12M26 28V3"/></svg>
    </div>
    <svg width="33" height="25" viewBox="0 0 33 25" fill="none" stroke="#052224" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h26l-5-5M31 17H5l5 5"/></svg>
    <svg width="27" height="23" viewBox="0 0 27 23" fill="none" stroke="#052224" stroke-width="2" stroke-linejoin="round"><rect x="2" y="2" width="9" height="8" rx="2"/><rect x="16" y="2" width="9" height="8" rx="2"/><rect x="2" y="13" width="9" height="8" rx="2"/><rect x="16" y="13" width="9" height="8" rx="2"/></svg>
    <svg width="22" height="27" viewBox="0 0 22 27" fill="none" stroke="#052224" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="7" r="5"/><path d="M2 25c0-5 4-8 9-8s9 3 9 8"/></svg>
  </div>
</div>
<script>
(function(){
 var nav=document.querySelector('.nav'),panel=document.querySelector('.panel'),ttl=document.getElementById('ttl');
 var icons=[].slice.call(nav.querySelectorAll(':scope > svg, :scope > div'));
 var names=['Home','Analysis','Transactions','Categories','Profile'];
 var orig=panel.innerHTML;
 var hl=document.createElement('div');hl.className='hl';nav.insertBefore(hl,nav.firstChild);
 function wireTabs(){
  var tabs=panel.querySelectorAll('.tab');
  tabs.forEach(function(t){t.onclick=function(){tabs.forEach(function(x){x.classList.remove('on')});t.classList.add('on');};});
 }
 function go(i){
  var r=icons[i].getBoundingClientRect(),n=nav.getBoundingClientRect();
  var scale=n.width/nav.offsetWidth||1;
  hl.style.left=((r.left-n.left)/scale+r.width/scale/2-28.5)+'px';
  ttl.textContent=names[i];
  [].slice.call(document.querySelector('.phone').children).forEach(function(el){
   var t=parseFloat(el.style.top);
   if(t>=136&&t<=243)el.style.display=(i===1)?'':'none';
  });
  if(i===1){panel.innerHTML=orig;wireTabs();}
  else{panel.innerHTML='<div class="ph">'+names[i]+'</div>';}
  try{history.replaceState(null,'','#'+names[i].toLowerCase());}catch(e){}
 }
 icons.forEach(function(el,i){
  var h=document.createElement('div');h.className='hit';
  var r=el.getBoundingClientRect(),n=nav.getBoundingClientRect();
  var s=n.width/nav.offsetWidth||1;
  h.style.left=((r.left-n.left)/s-9)+'px';h.style.width=(r.width/s+18)+'px';
  h.onclick=function(){go(i)};nav.appendChild(h);
 });
 wireTabs();
 var start=1,hs=(location.hash||'').slice(1);
 names.forEach(function(x,i){if(x.toLowerCase()===hs)start=i});
 go(start);
})();
</script>
</body>
</html>
